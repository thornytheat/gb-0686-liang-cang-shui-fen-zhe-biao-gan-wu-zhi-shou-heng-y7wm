{% extends "base.html" %}{% block content %}<div class="formula"><span>净重 × 净粮率</span><b>×</b><span>干物质率</span><b>÷</b><span>标准干物质率</span><strong>折标 kg</strong></div><div class="grain-columns"><section class="panel span-two"><div class="panel__head"><h2>折标证据</h2></div>{{ledger(data.rows,['id','net_kg','clean_kg','dry_kg','standard_kg'])}}</section><section class="panel"><div class="panel__head"><h2>干物质标尺</h2><sup>04</sup></div><div class="rulers">{% for row in result.balances %}<div><label>{{row.bin}}</label><b>{{'%.2f'|format(row.dry_kg|float)}} kg</b><div class="ruler"><i style="width:{{(row.dry_kg|float / row.net_kg|float * 100) if row.net_kg|float else 0}}%"></i></div></div>{% endfor %}</div></section></div>{% endblock %}
